backend:
  name: github
  repo: bogdan787878/coralclub
  branch: main
  # A "Sign in with GitHub" button needs an OAuth relay. Without one,
  # Sveltia CMS also lets you paste a GitHub fine-grained personal access
  # token on the sign-in screen (repo contents: read & write). See ADMIN.md.

# Uploaded images are committed to the repo here; the path stored in the
# JSON uses `public_folder`, and the app's asset() helper adds the
# /coralclub base path at runtime.
media_folder: "public/images/products"
public_folder: "/images/products"

# Commit straight to the branch (no PR workflow).
publish_mode: simple

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: products
    label: Products
    label_singular: Product
    identifier_field: name
    summary: "{{fields.name}} — {{fields.category}}"
    folder: content/products
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{fields.slug}}"
    fields:
      - name: slug
        label: "Slug (URL)"
        widget: string
        hint: "lowercase-with-dashes — the product page address, e.g. /products/<slug>"
        pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "lowercase letters, digits and dashes only"]

      - name: name
        label: "Название продукта"
        widget: string

      - name: headline
        label: "Заголовок карточки (карусель, 2 строки)"
        widget: string

      - name: category
        label: "Категория (для тегов)"
        widget: string

      - name: cardTitle
        label: "Строка цели на карточке"
        widget: string

      - name: goals
        label: "Цели (для подбора в квизе)"
        widget: select
        multiple: true
        min: 1
        options:
          - energy
          - sleep
          - skin
          - detox
          - weight
          - immune
          - hydration

      - name: coralId
        label: "coralclub.ru ID (для корзины)"
        widget: string
        required: false
        hint: "Product id from a coralclub.ru share-cart link. Leave blank to link out to the shop."

      - name: price
        label: "Цена"
        widget: string
        hint: "e.g. $29.99"

      - name: clubPrice
        label: "Клубная цена"
        widget: string
        hint: "e.g. $21.99 — shown on the PDP as the main price; on the carousel card it's the struck-through price"

      - name: description
        label: "Описание"
        widget: text

      - name: carouselImages
        label: "Картинки — карусель"
        widget: list
        summary: "{{fields.image}}"
        field:
          name: image
          label: Image
          widget: image
          media_library:
            config:
              max_file_size: 5000000

      - name: pdpImages
        label: "Картинки — страница товара (PDP)"
        widget: list
        summary: "{{fields.image}}"
        field:
          name: image
          label: Image
          widget: image
          media_library:
            config:
              max_file_size: 5000000

      - name: howToUse
        label: "How to use"
        widget: text
        required: false

      - name: elements
        label: "Элементы состава (плитки как в таблице Менделеева, после FDA-блока)"
        widget: list
        required: false
        summary: "{{fields.symbol}} — {{fields.name}}"
        fields:
          - { name: symbol, label: "Символ (Ca, Mg, K…)", widget: string }
          - { name: name, label: "Название (Calcium…)", widget: string }

      - name: manufacturing
        label: "Manufacturing detail"
        widget: object
        collapsed: true
        fields:
          - { name: countryOfOrigin, label: "Country of origin", widget: string, required: false }
          - { name: shippingWeight, label: "Shipping weight", widget: string, required: false }
          - { name: expiration, label: "Expiration date", widget: string, required: false }
          - { name: storage, label: "Storage method", widget: text, required: false }
          - { name: ingredients, label: "Ingredient list", widget: text, required: false }
          - name: supplementFacts
            label: "Supplement Facts"
            widget: object
            fields:
              - name: servingLabel
                label: "Column header"
                widget: string
                default: "Amount Per Serving"
              - name: rows
                label: "Rows"
                label_singular: "Row"
                widget: list
                summary: "{{fields.name}} — {{fields.amount}}"
                fields:
                  - { name: name, label: "Nutrient", widget: string }
                  - { name: amount, label: "Amount per serving", widget: string }
                  - { name: dv, label: "%DV", widget: string, required: false }

  - name: series
    label: "Series blocks"
    label_singular: "Series block"
    identifier_field: id
    summary: "{{fields.titleLead}} ({{fields.products.length}})"
    description: "Standalone homepage blocks: a large image, a heading and a carousel of products (e.g. LIŪMI in the Hydration area)."
    folder: content/series
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{fields.id}}"
    media_folder: "/public/images/series"
    public_folder: "/images/series"
    fields:
      - name: id
        label: "ID (URL-safe)"
        widget: string
        pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "lowercase letters, digits and dashes only"]
      - name: titleLead
        label: "Heading — line 1"
        widget: string
      - name: titleAccent
        label: "Heading — line 2 (italic accent)"
        widget: string
      - name: blurb
        label: "Blurb (paragraph under the heading)"
        widget: text
        hint: "Shown only when the Feature row below is empty."
      - name: features
        label: "Feature row (icon + label, replaces the blurb)"
        widget: list
        required: false
        summary: "{{fields.text}}"
        fields:
          - name: icon
            label: "Icon (~24px wide)"
            widget: image
            media_library:
              config:
                max_file_size: 1000000
          - name: text
            label: "Label (16/20)"
            widget: string
      - name: image
        label: "Large image"
        widget: image
        required: false
        media_library:
          config:
            max_file_size: 5000000
      - name: products
        label: "Product slugs (carousel order)"
        widget: list
        summary: "{{fields.slug}}"
        field: { name: slug, label: "Slug", widget: string }

  - name: personalization
    label: "Personalization"
    files:
      - name: domains
        label: "Domain sets"
        file: content/domains.json
        description: "12 health domains, each with its list of product slugs (a slug must match a product's Slug field)."
        fields:
          - name: domains
            label: "Domains"
            widget: list
            summary: "{{fields.label}} ({{fields.products.length}})"
            fields:
              - { name: id, label: "ID", widget: string }
              - { name: label, label: "Label (EN)", widget: string }
              - name: goal
                label: "Quiz goal"
                widget: select
                options: [energy, sleep, skin, detox, weight, immune, hydration]
              - name: products
                label: "Product slugs"
                widget: list
                field: { name: slug, label: "Slug", widget: string }
