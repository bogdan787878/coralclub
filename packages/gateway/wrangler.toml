# Шлюз чек-аута Coral Club (Cloudflare Worker). Развёртывание: packages/gateway/README.md.
name = "coral-lk-checkout"
main = "src/worker.mjs"
compatibility_date = "2024-11-01"

[vars]
# Откуда разрешены запросы (страница ЛК). Добавьте свои адреса через запятую.
ALLOWED_ORIGINS = "https://bogdan787878.github.io,http://localhost:3300"
CC4_BASE = "https://api.coral.club"

# Хранилище сессий магазина: создаётся командой `wrangler kv namespace create SESSIONS`, подставьте выданный id.
[[kv_namespaces]]
binding = "SESSIONS"
id = "169325c96aea490cb6668f84a09b6b89"
